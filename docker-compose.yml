# ──────────────────────────────────────────────────────────────
# AgencyPulse · docker-compose.yml
# Services: Postgres 15, Redis 7, App (Fastify + Next.js), Worker (BullMQ)
# ──────────────────────────────────────────────────────────────

version: "3.9"

volumes:
 pg_data:
 driver: local
 redis_data:
 driver: local

networks:
 agencypulse:
 driver: bridge

services:

 # ── Postgres ────────────────────────────────────────────────
 postgres:
 image: postgres:15-alpine
 container_name: agencypulse-postgres
 restart: unless-stopped
 environment:
 POSTGRES_USER: ${POSTGRES_USER:-agencypulse}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
 POSTGRES_DB: ${POSTGRES_DB:-agencypulse}
 volumes:
 - pg_data:/var/lib/postgresql/data
 ports:
 - "127.0.0.1:5432:5432"
 networks: [agencypulse]
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agencypulse}"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ── Redis ───────────────────────────────────────────────────
 redis:
 image: redis:7-alpine
 container_name: agencypulse-redis
 restart: unless-stopped
 command: >
 redis-server
 --requirepass ${REDIS_PASSWORD:-change_me}
 --maxmemory 256mb
 --maxmemory-policy allkeys-lru
 --save 60 1
 --appendonly yes
 volumes:
 - redis_data:/data
 ports:
 - "127.0.0.1:6379:6379"
 networks: [agencypulse]
 healthcheck:
 test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ── App (Fastify API + Next.js frontend) ────────────────────
 app:
 build:
 context: .
 dockerfile: Dockerfile
 container_name: agencypulse-app
 restart: unless-stopped
 ports:
 - "3003:3003"
 environment:
 DATABASE_URL: postgresql://${POSTGRES_USER:-agencypulse}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-agencypulse}?schema=public
 REDIS_URL: redis://:${REDIS_PASSWORD:-change_me}@redis:6379
 NODE_ENV: production
 PORT: "3003"
 HOSTNAME: "0.0.0.0"
 FRONTEND_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
 NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
 env_file:
 - .env.local
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks: [agencypulse]
 healthcheck:
 test: ["CMD", "node", "-e", "fetch('http://localhost:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
 interval: 30s
 timeout: 5s
 retries: 3

 # ── Worker (BullMQ background jobs: reports, sync, emails) ─
 worker:
 build:
 context: .
 dockerfile: Dockerfile.worker
 container_name: agencypulse-worker
 restart: unless-stopped
 environment:
 DATABASE_URL: postgresql://${POSTGRES_USER:-agencypulse}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-agencypulse}?schema=public
 REDIS_URL: redis://:${REDIS_PASSWORD:-change_me}@redis:6379
 NODE_ENV: production
 FRONTEND_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
 env_file:
 - .env.local
 depends_on:
 postgres:
 condition: service_healthy
 redis:
 condition: service_healthy
 networks: [agencypulse]
