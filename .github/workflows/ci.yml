name: AgencyPulse CI/CD

on:
 push:
 branches: [main, develop]
 tags: ["v*"]
 pull_request:
 branches: [main, develop]

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

jobs:

 # ── Lint & Type-check ───────────────────────────────────────
 lint-and-type:
 name: Lint & Type-check
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: "npm"

 - name: Install dependencies
 run: npm ci

 - name: Lint
 run: npm run lint

 - name: Type-check
 run: npm run typecheck

 # ── Unit Tests ─────────────────────────────────────────────
 test:
 name: Unit & Integration Tests
 runs-on: ubuntu-latest
 needs: lint-and-type
 services:
 postgres:
 image: postgres:15-alpine
 env:
 POSTGRES_USER: agencypulse
 POSTGRES_PASSWORD: agencypulse_test
 POSTGRES_DB: agencypulse_test
 ports: ["5432:5432"]
 options: >-
 --health-cmd "pg_isready -U agencypulse"
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 redis:
 image: redis:7-alpine
 env:
 REDIS_PASSWORD: redis_test
 ports: ["6379:6379"]
 options: >-
 --health-cmd "redis-cli -a redis_test ping"
 --health-interval 10s
 --health-timeout 5s
 --health-retries 5
 steps:
 - uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: "npm"

 - name: Install dependencies
 run: npm ci

 - name: Run Prisma migrate deploy (test DB)
 env:
 DATABASE_URL: postgresql://agencypulse:agencypulse_test@localhost:5432/agencypulse_test?schema=public
 REDIS_URL: redis://:redis_test@localhost:6379
 NODE_ENV: test
 run: npx prisma migrate deploy --schema=./backend/prisma/schema.prisma

 - name: Seed test data
 env:
 DATABASE_URL: postgresql://agencypulse:agencypulse_test@localhost:5432/agencypulse_test
 REDIS_URL: redis://:redis_test@localhost:6379
 run: npx tsx scripts/seed.ts

 - name: Run tests
 env:
 DATABASE_URL: postgresql://agencypulse:agencypulse_test@localhost:5432/agencypulse_test
 REDIS_URL: redis://:redis_test@localhost:6379
 run: npm test -- --coverage

 - name: Upload coverage
 uses: codecov/codecov-action@v4
 with:
 files: ./coverage/lcov.info
 fail_ci_if_error: false

 # ── Build Docker image ──────────────────────────────────────
 build-image:
 name: Build Docker Image
 runs-on: ubuntu-latest
 needs: test
 steps:
 - uses: actions/checkout@v4

 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3

 - name: Login to Docker Hub (push on tag)
 if: startsWith(github.ref, 'refs/tags/')
 uses: docker/login-action@v3
 with:
 registry: docker.io
 username: ${{ secrets.DOCKERHUB_USERNAME }}
 password: ${{ secrets.DOCKERHUB_TOKEN }}

 - name: Login to GHCR (always)
 uses: docker/login-action@v3
 with:
 registry: ghcr.io
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}

 - name: Extract metadata
 id: meta
 uses: docker/metadata-action@v5
 with:
 images: |
 ghcr.io/${{ github.repository }}
 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/agencypulse
 tags: |
 type=ref,event=tag
 type=sha,prefix=sha-
 type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

 - name: Build and push
 uses: docker/build-push-action@v6
 with:
 context: .
 file: ./Dockerfile
 push: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
 tags: ${{ steps.meta.outputs.tags }}
 labels: ${{ steps.meta.outputs.labels }}
 cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache
 cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache,mode=max

 # ── Deploy to Fly.io (main + tags only) ────────────────────
 deploy-fly:
 name: Deploy to Fly.io
 runs-on: ubuntu-latest
 needs: [test, build-image]
 if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
 environment: production
 steps:
 - uses: actions/checkout@v4

 - name: Setup Fly CLI
 uses: superfly/flyctl-actions/setup-flyctl@v1

 - name: Deploy to Fly.io
 run: flyctl deploy --remote-only
 env:
 FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

 # ── Deploy to Vercel (main only) ───────────────────────────
 deploy-vercel:
 name: Deploy Frontend to Vercel
 runs-on: ubuntu-latest
 needs: [lint-and-type]
 if: github.ref == 'refs/heads/main'
 environment: production
 steps:
 - uses: actions/checkout@v4

 - name: Setup Node.js
 uses: actions/setup-node@v4
 with:
 node-version: 20
 cache: "npm"

 - name: Install dependencies
 run: npm ci

 - name: Run Prisma generate
 run: npx prisma generate

 - name: Build Next.js
 run: npm run build
 env:
 DATABASE_URL: ${{ secrets.DATABASE_URL }}
 REDIS_URL: ${{ secrets.REDIS_URL }}
 NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

 - name: Deploy to Vercel
 uses: amondnet/vercel-action@v25
 with:
 vercel-token: ${{ secrets.VERCEL_TOKEN }}
 vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
 vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
 working-directory: .
 prod: true
