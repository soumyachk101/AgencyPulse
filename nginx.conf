# ──────────────────────────────────────────────────────────────
# AgencyPulse · nginx.conf
# Reverse proxy with TLS, rate limiting, and security headers.
# Drop into /etc/nginx/sites-available/agencypulse.conf
# and symlink into sites-enabled/.
# ──────────────────────────────────────────────────────────────

# ── Upstreams ───────────────────────────────────────────────
upstream agencypulse_app {
 least_conn;
 server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
 keepalive 32;
}

# ── Rate-limit zones ────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Static asset cache ──────────────────────────────────────
proxy_cache_path /var/cache/nginx/agencypulse levels=1:2 keys_zone=cache_static:10m max_size=1g inactive=24h use_temp_path=off;

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
 listen 80;
 listen [::]:80;
 server_name agencypulse.app api.agencypulse.app;

 location /.well-known/acme-challenge/ {
 root /var/www/letsencrypt;
 }

 location / {
 return 301 https://$host$request_uri;
 }
}

# ── Main HTTPS server ───────────────────────────────────────
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name agencypulse.app api.agencypulse.app;

 # ── TLS (Let's Encrypt) ──────────────────────────────────
 ssl_certificate /etc/letsencrypt/live/agencypulse.app/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/agencypulse.app/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
 ssl_prefer_server_ciphers off;
 ssl_session_timeout 1d;
 ssl_session_cache shared:SSL:50m;
 ssl_session_tickets off;
 ssl_stapling on;
 ssl_stapling_verify on;

 # ── Security headers ────────────────────────────────────
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none';" always;

 # ── Logs ─────────────────────────────────────────────────
 access_log /var/log/nginx/agencypulse.access.log;
 error_log /var/log/nginx/agencypulse.error.log;

 # ── Limits ───────────────────────────────────────────────
 client_max_body_size 50M;
 client_body_timeout 60s;
 client_header_timeout 60s;
 limit_conn conn_limit 50;

 # ── Gzip ─────────────────────────────────────────────────
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_comp_level 5;
 gzip_types
 application/atom+xml
 application/javascript
 application/json
 application/rss+xml
 application/xhtml+xml
 application/xml
 font/eot
 font/otf
 font/ttf
 image/svg+xml
 text/css
 text/javascript
 text/plain
 text/xml;

 # ── Static assets (cached aggressively) ─────────────────
 # Next.js static chunks
 location /_next/static/ {
 proxy_cache cache_static;
 proxy_pass http://agencypulse_app;
 proxy_cache_valid 200 365d;
 expires 1y;
 add_header Cache-Control "public, immutable";
 add_header X-Cache-Status $upstream_cache_status;
 access_log off;
 }

 # Public assets
 location /public/ {
 proxy_cache cache_static;
 proxy_pass http://agencypulse_app;
 proxy_cache_valid 200 30d;
 expires 30d;
 add_header Cache-Control "public, immutable";
 access_log off;
 }

 # ── Auth endpoints (strict rate limit) ───────────────────
 location ~ ^/api/auth/ {
 limit_req zone=login_limit burst=5 nodelay;
 limit_req_status 429;

 proxy_pass http://agencypulse_app;
 include /etc/nginx/proxy_params.conf;
 }

 # ── Webhooks (no rate limit — signature-verified upstream) ─
 location ~ ^/api/webhooks/ {
 proxy_pass http://agencypulse_app;
 include /etc/nginx/proxy_params.conf;
 }

 # ── API endpoints ────────────────────────────────────────
 location /api/ {
 limit_req zone=api_limit burst=60 nodelay;
 limit_req_status 429;

 proxy_pass http://agencypulse_app;
 include /etc/nginx/proxy_params.conf;
 }

 # ── Everything else (Next.js app shell) ───────────────────
 location / {
 limit_req zone=general_limit burst=40 nodelay;

 proxy_pass http://agencypulse_app;
 include /etc/nginx/proxy_params.conf;
 }
}
