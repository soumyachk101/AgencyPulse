# ──────────────────────────────────────────────────────────────
# AgencyPulse · fly.toml
# Fly.io deployment config — Fastify API server on port 3003
# plus a separate worker process group.
# ──────────────────────────────────────────────────────────────

app = "agencypulse-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"

# ── HTTP service (Fastify API) ───────────────────────────────
[http_service]
internal_port = 3003
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/api/health"
protocol = "http"
timeout = "5s"

# ── Process groups ───────────────────────────────────────────
[processes]
app = "node backend/dist/index.js"
worker = "node backend/dist/queue/worker.js"

# ── VM sizing ────────────────────────────────────────────────
[vm]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
